---
# Procurement with an approval before anything is pushed (docs/how-to/run-procurement-from-a-pipeline.md).
# Runs on a self-hosted runner on the update center's Docker host (label uc-host), in the deployment
# directory UC_DIR, which holds .env, config/uc.toml and secrets/; GitHub-hosted runners cannot reach
# it. Give the "procurement" environment required reviewers (Settings > Environments): they are the
# approval. Without them GitHub runs the push job without waiting, so its first step checks for them
# and stops, pushing nothing. In a private repository on GitHub Free, Pro or Team, an environment
# cannot have required reviewers, so the push job always stops. There, use GitHub Enterprise (required
# reviewers in private repositories), a public repository, or the Jenkins or GitLab CI example.
# A run that stages nothing skips the push job and every job after it, so no one is asked to approve.
name: Procure missing files

on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
  # schedule:
  #   - cron: "0 6 * * 1"  # weekly, on Monday at 06:00 UTC

# One run at a time: the staging folder is shared. GitHub keeps one pending run and cancels older pending
# ones, so a run waiting behind another may be dropped. The push job also checks procurement.sha256 and
# stops if the staged list changed since the review.
concurrency:
  group: easy-update-center-procurement
  cancel-in-progress: false

env:
  UC_DIR: /opt/easy-update-center

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: [self-hosted, uc-host]
    steps:
      - name: Check the settings
        working-directory: ${{ env.UC_DIR }}
        run: docker compose run --rm --no-deps uc config --check
      - name: Check the repository
        working-directory: ${{ env.UC_DIR }}
        # Exit 1 means there is something to procure, which is what this workflow is for.
        run: docker compose run --rm uc doctor || [ $? -eq 1 ]

  stage:
    needs: check
    runs-on: [self-hosted, uc-host]
    # Whether anything was staged: uc procure stage prints its "next: review" line only when procurement.json lists files.
    outputs:
      staged: ${{ steps.stage.outputs.staged }}
    steps:
      - name: Stage the missing files for review
        id: stage
        working-directory: ${{ env.UC_DIR }}
        # A failed stage still copies what it staged, so the reviewers can read why; the job then fails.
        run: |
          rc=0
          docker compose run --rm uc procure stage 2>&1 | tee "$RUNNER_TEMP/stage-report.txt" || rc=$?
          if [ -e procurement/procurement.json ]; then
            cp procurement/procurement.json "$RUNNER_TEMP/"
            sha256sum procurement/procurement.json > "$RUNNER_TEMP/procurement.sha256"
          fi
          if grep -q '^next: review' "$RUNNER_TEMP/stage-report.txt"; then
            echo "staged=true" >> "$GITHUB_OUTPUT"
          else
            echo "staged=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Nothing staged::nothing was staged, so there is nothing to review or push"
          fi
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: procurement
          path: |
            ${{ runner.temp }}/stage-report.txt
            ${{ runner.temp }}/procurement.json
            ${{ runner.temp }}/procurement.sha256

  push:
    needs: stage
    # Only when something was staged: a job that does not run asks no one to approve it, and generate, verify
    # and clean, which need it in turn, are skipped with it. GitHub adds success(), so a failed stage stops it too.
    if: needs.stage.outputs.staged == 'true'
    runs-on: [self-hosted, uc-host]
    # The review: required reviewers approve this job after reading the artifacts.
    environment: procurement
    # Only for the first step, which reads the environment's protection rules.
    permissions:
      actions: read
    steps:
      - name: Check that the procurement environment requires reviewers
        # Without required reviewers, GitHub runs this job without waiting for an approval, and it creates
        # a missing environment without them: stop here, before anything is pushed. Needs curl on the runner.
        # Where administrators can bypass the protection rules, it warns and carries on.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! environment="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/environments/procurement")"; then
            echo "::error::cannot read the procurement environment, so cannot tell whether anyone approved this push"
            exit 1
          fi
          if ! grep -Eq '"type": *"required_reviewers"' <<<"$environment"; then
            echo "::error::the procurement environment has no required reviewers, so nobody approved this push: add them under Settings > Environments"
            exit 1
          fi
          if grep -Eq '"can_admins_bypass": *true' <<<"$environment"; then
            setting="Allow administrators to bypass configured protection rules"
            echo "::warning title=Approval can be bypassed::administrators can push without an approval: turn off '$setting' in the procurement environment"
          fi
      - uses: actions/download-artifact@v4
        with:
          name: procurement
          path: ${{ runner.temp }}
      - name: Check that the staged list is the one that was reviewed
        working-directory: ${{ env.UC_DIR }}
        run: sha256sum -c "$RUNNER_TEMP/procurement.sha256"
      - name: Push the approved files
        working-directory: ${{ env.UC_DIR }}
        run: docker compose run --rm uc procure push

  generate:
    needs: push
    runs-on: [self-hosted, uc-host]
    steps:
      - name: Publish a release now
        working-directory: ${{ env.UC_DIR }}
        run: docker compose run --rm uc generate

  verify:
    needs: generate
    runs-on: [self-hosted, uc-host]
    steps:
      - name: Status
        working-directory: ${{ env.UC_DIR }}
        run: docker compose run --rm uc status
      - name: Check the repository again
        working-directory: ${{ env.UC_DIR }}
        run: docker compose run --rm uc doctor || [ $? -eq 1 ]

  clean:
    needs: verify
    runs-on: [self-hosted, uc-host]
    steps:
      - name: Delete the staged files the repository now holds
        working-directory: ${{ env.UC_DIR }}
        run: docker compose run --rm uc procure clean

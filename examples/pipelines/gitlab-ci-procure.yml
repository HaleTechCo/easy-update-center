---
# The review and what follows it, for gitlab-ci.yml (docs/how-to/run-procurement-from-a-pipeline.md).
# Keep this file at the root of the pipeline repository: when something was staged, gitlab-ci.yml's
# stage job copies it as the configuration of the child pipeline that the procure job starts. UC_DIR
# is the directory gitlab-ci.yml's stage job worked in, passed on by the procure job. Protect the
# "procurement" environment (Settings > CI/CD > Protected environments) so only its approvers can run
# the review job.
# No job here takes the easy-update-center resource group: the procure job holds it until this
# pipeline ends, so a job here waiting for it would wait forever.
stages: [review, push, generate, verify, clean]

default:
  tags: [uc-host]
  before_script:
    - set -o pipefail
    - cd "$UC_DIR"

review:
  stage: review
  environment: procurement
  when: manual
  allow_failure: false
  # Like every job, this one runs on the uc-host runner (the default tags); it only echoes the approver.
  script:
    - echo "approved by $GITLAB_USER_LOGIN"

push:
  stage: push
  # The stage job's artifacts come from the parent pipeline. needs makes this job wait only for the jobs
  # it lists, so review must stay listed: without it, the push would not wait for the approval.
  needs:
    - pipeline: $PARENT_PIPELINE_ID
      job: stage
    - review
  script:
    # Stop if procurement.json changed since the review: between the stage job and the procure job,
    # another pipeline can still check and stage before the procure job takes the resource group.
    - sha256sum -c "$CI_PROJECT_DIR/procurement.sha256"
    - docker compose run --rm uc procure push

generate:
  stage: generate
  script:
    - docker compose run --rm uc generate

verify:
  stage: verify
  script:
    - docker compose run --rm uc status
    - docker compose run --rm uc doctor || [ $? -eq 1 ]

clean:
  stage: clean
  script:
    - docker compose run --rm uc procure clean

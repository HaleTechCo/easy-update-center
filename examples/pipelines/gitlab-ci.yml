---
# Procurement with an approval before anything is pushed (docs/how-to/run-procurement-from-a-pipeline.md).
# Runs on a shell runner on the update center's Docker host (tag uc-host), in the deployment directory
# UC_DIR, which holds .env, config/uc.toml and secrets/. Run it from Build > Pipelines > New pipeline
# (Run pipeline before GitLab 17.7).
# Two files: this one checks and stages; the review and what follows run in a child pipeline from
# gitlab-ci-procure.yml, which must sit at the root of the repository. A run that stages nothing starts
# a child pipeline of one job that says so, and no one is asked to approve.
# Protect the "procurement" environment (Settings > CI/CD > Protected environments) so only its
# approvers can run the review job.
variables:
  UC_DIR: /opt/jenkins-update-center

stages: [check, stage, procure]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    # - if: $CI_PIPELINE_SOURCE == "schedule"  # a weekly schedule, set in Build > Pipeline schedules

# One pipeline at a time: the staging folder is shared. Each job here takes the jenkins-update-center
# resource group, and the procure job holds it until the child pipeline ends, the review included. A
# resource group serializes jobs, not pipelines: between this pipeline's stage job and its procure job,
# another pipeline can still check and stage. The push job therefore checks procurement.sha256 and
# stops if the staged list changed since the review.
default:
  tags: [uc-host]
  before_script:
    - set -o pipefail
    - cd "$UC_DIR"

check:
  stage: check
  resource_group: jenkins-update-center
  script:
    - docker compose run --rm --no-deps uc config --check
    # Exit 1 means there is something to procure, which is what this pipeline is for.
    - docker compose run --rm uc doctor || [ $? -eq 1 ]

stage:
  stage: stage
  resource_group: jenkins-update-center
  script:
    # A failed stage still copies what it staged (artifacts are kept below), so the reviewers can read why.
    - rc=0; docker compose run --rm uc procure stage 2>&1 | tee "$CI_PROJECT_DIR/stage-report.txt" || rc=$?
    - |
      if [ -e procurement/procurement.json ]; then
        cp procurement/procurement.json "$CI_PROJECT_DIR/"
        sha256sum procurement/procurement.json > "$CI_PROJECT_DIR/procurement.sha256"
      fi
    # The child pipeline: gitlab-ci-procure.yml when uc procure stage printed its "next: review" line,
    # which it prints only when procurement.json lists files; otherwise one job that says nothing was staged.
    - |
      child="$CI_PROJECT_DIR/procure-pipeline.yml"
      if grep -q '^next: review' "$CI_PROJECT_DIR/stage-report.txt"; then
        cp "$CI_PROJECT_DIR/gitlab-ci-procure.yml" "$child"
      else
        echo "nothing was staged, so there is nothing to review or push"
        echo '{"nothing-staged": {"tags": ["uc-host"], "script": ["echo nothing was staged, so there is nothing to review or push"]}}' > "$child"
      fi
    - exit "$rc"
  artifacts:
    paths: [stage-report.txt, procurement.json, procurement.sha256, procure-pipeline.yml]
    when: always

procure:
  stage: procure
  resource_group: jenkins-update-center
  # strategy: depend keeps this job running, and so holding the resource group, until the child pipeline
  # ends: while it waits at the review too, so cancel a pipeline whose review no one will run. UC_DIR
  # reaches the child from variables: above; forwarding the pipeline variables also passes a UC_DIR set
  # when running the pipeline or in its schedule.
  trigger:
    include:
      - artifact: procure-pipeline.yml
        job: stage
    strategy: depend
    forward:
      pipeline_variables: true
  variables:
    PARENT_PIPELINE_ID: $CI_PIPELINE_ID

---
# Easy Update Center for Jenkins (docs/architecture/overview.md).
#   online:     docker compose up -d
#   air-gapped: docker compose -f compose.yaml -f compose.airgapped.yaml up -d
#   one-shot:   docker compose run --rm uc doctor | procure | generate | rollback | status
# The images are this release's on GHCR; tools/release.py prepare sets their version. To run images
# built from this checkout instead, add compose.build.yaml (docs/getting-started/online.md#or-build-from-source).
name: easy-update-center

x-uc: &uc
  image: ${UC_IMAGE:-ghcr.io/haletechco/easy-update-center-uc:0.1.0}
  user: "${UC_UID:-10001}:${UC_GID:-10001}"  # docs/reference/configuration.md#compose
  env_file: ${UC_ENV_FILE:-.env}
  read_only: true
  tmpfs:
    - /tmp
  volumes:
    - uc-data:/data
    - ./config:/config:ro
  networks: [default, repo]
  depends_on:
    repo-adapter: {condition: service_healthy}
  secrets:
    - update-center.key
    - update-center.cert
    - root-ca.crt
    - repo_username
    - repo_password
    - github_username
    - github_token

services:
  web:
    image: ${WEB_IMAGE:-ghcr.io/haletechco/easy-update-center-web:0.1.0}
    user: "${UC_UID:-10001}:${UC_GID:-10001}"
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "${HTTP_PORT:-8080}:8080"
      - "${HTTPS_PORT:-8443}:8443"
    volumes:
      - uc-data:/data:ro
    secrets:
      - download_proxy_auth
    # Only its own variables, from .env (docs/architecture/request-routing.md#where-web-gets-its-settings);
    # no env_file, so the rest of .env, proxy credentials included, never reaches it.
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-}
      MODE: ${MODE:-}
      DOWNLOAD_BACKEND: ${DOWNLOAD_BACKEND:-}
      DOWNLOAD_BACKEND_URL: ${DOWNLOAD_BACKEND_URL:-}
      DOWNLOAD_ACCESS: ${DOWNLOAD_ACCESS:-}
      DOWNLOAD_PROXY_CA_FILE: ${DOWNLOAD_PROXY_CA_FILE:-}
      TLS_CERT_FILE: ${TLS_CERT_FILE:-}
      TLS_KEY_FILE: ${TLS_KEY_FILE:-}
    restart: unless-stopped

  # One-shot, only when called: `docker compose run --rm setup` (first-time setup, safe to repeat), or
  # `setup secrets | pki-init | pki-rotate` (docs/reference/cli.md#the-setup-service). No network, no
  # compose secrets, no settings; it writes only ./secrets.
  setup:
    image: ${UC_IMAGE:-ghcr.io/haletechco/easy-update-center-uc:0.1.0}
    user: "${UC_UID:-10001}:${UC_GID:-10001}"
    profiles: ["setup"]
    network_mode: none
    entrypoint: ["uc-setup"]
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./secrets:/setup/secrets

  # Answers the generator's Artifactory requests from Artifactory or Artifact Keeper and fills in POMs,
  # descriptions and release dates from the archives. Idle when REPO_ADAPTER is off (the online default).
  repo-adapter:
    image: ${UC_IMAGE:-ghcr.io/haletechco/easy-update-center-uc:0.1.0}
    user: "${UC_UID:-10001}:${UC_GID:-10001}"
    env_file: ${UC_ENV_FILE:-.env}
    command: ["repo-adapter"]
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - uc-data:/data
      - ./config:/config:ro
    networks: [repo, repo-egress]
    secrets:
      - repo_username
      - repo_password
    healthcheck:
      test: ["CMD", "uc", "repo-adapter", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    restart: unless-stopped

  scheduler:
    <<: *uc
    command: ["schedule"]
    restart: unless-stopped

  # One-shot commands. Only this service stages downloads for review and writes to the repository
  # (uc procure stage and push, docs/how-to/procure-missing-files.md): it is the only service with a
  # network that mounts ./procurement, and the only one that receives repo_push_auth.
  # It runs only when an operator calls it.
  uc:
    <<: *uc
    profiles: ["tools"]
    volumes:
      - uc-data:/data
      - ./config:/config:ro
      - ./procurement:/procurement
    secrets:
      - update-center.key
      - update-center.cert
      - root-ca.crt
      - repo_username
      - repo_password
      - github_username
      - github_token
      - repo_push_auth

networks:
  default: {}
  # uc, scheduler and the adapter only. The adapter reaches the repository through repo-egress and is
  # on no network web is on, so the internet-facing web container cannot reach it (make compose-check).
  repo:
    internal: true
  repo-egress: {}

volumes:
  uc-data:

secrets:
  update-center.key:
    file: ./secrets/update-center.key
  update-center.cert:
    file: ./secrets/update-center.cert
  root-ca.crt:
    file: ./secrets/root-ca.crt
  repo_username:
    file: ./secrets/repo_username
  repo_password:
    file: ./secrets/repo_password
  github_username:
    file: ./secrets/github_username
  github_token:
    file: ./secrets/github_token
  download_proxy_auth:
    file: ./secrets/download_proxy_auth
  repo_push_auth:
    file: ./secrets/repo_push_auth

---
# Jenkins update center (docs/architecture/overview.md).
#   online:     docker compose up -d
#   air-gapped: docker compose -f compose.yaml -f compose.airgapped.yaml up -d
#   one-shot:   docker compose run --rm uc doctor | generate | rollback | status
name: jenkins-update-center

x-uc: &uc
  image: ${UC_IMAGE:-jenkins-uc/uc:local}
  env_file: ${UC_ENV_FILE:-.env}
  read_only: true
  tmpfs:
    - /tmp
  volumes:
    - uc-data:/data
    - ./config:/config:ro
  networks: [default, repo]
  depends_on:
    repo-adapter: {condition: service_healthy}
  secrets:
    - update-center.key
    - update-center.cert
    - root-ca.crt
    - repo_username
    - repo_password
    - github_username
    - github_token

services:
  web:
    image: ${WEB_IMAGE:-jenkins-uc/web:local}
    env_file: ${UC_ENV_FILE:-.env}
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "${HTTP_PORT:-8080}:8080"
      - "${HTTPS_PORT:-8443}:8443"
    volumes:
      - uc-data:/data:ro
    secrets:
      - download_proxy_auth
    restart: unless-stopped

  # Answers the generator's Artifactory requests from Artifactory or Artifact Keeper and fills in POMs,
  # descriptions and release dates from the archives. Idle when REPO_ADAPTER is off (the online default).
  repo-adapter:
    image: ${UC_IMAGE:-jenkins-uc/uc:local}
    env_file: ${UC_ENV_FILE:-.env}
    command: ["repo-adapter"]
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - uc-data:/data
      - ./config:/config:ro
    networks: [repo, repo-egress]
    secrets:
      - repo_username
      - repo_password
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    restart: unless-stopped

  scheduler:
    <<: *uc
    command: ["schedule"]
    restart: unless-stopped

  # One-shot commands. Only this service stages downloads for review and writes to the repository
  # (uc doctor --download-* and --push, docs/how-to/procure-missing-files.md): it alone mounts
  # ./procurement and receives repo_push_auth.
  # It runs only when an operator calls it.
  uc:
    <<: *uc
    profiles: ["tools"]
    volumes:
      - uc-data:/data
      - ./config:/config:ro
      - ./procurement:/procurement
    secrets:
      - update-center.key
      - update-center.cert
      - root-ca.crt
      - repo_username
      - repo_password
      - github_username
      - github_token
      - repo_push_auth

networks:
  default: {}
  # uc, scheduler and the adapter only. The adapter reaches the repository through repo-egress and is
  # on no network web is on, so the internet-facing web container cannot reach it (make compose-check).
  repo:
    internal: true
  repo-egress: {}

volumes:
  uc-data:

secrets:
  update-center.key:
    file: ./secrets/update-center.key
  update-center.cert:
    file: ./secrets/update-center.cert
  root-ca.crt:
    file: ./secrets/root-ca.crt
  repo_username:
    file: ./secrets/repo_username
  repo_password:
    file: ./secrets/repo_password
  github_username:
    file: ./secrets/github_username
  github_token:
    file: ./secrets/github_token
  download_proxy_auth:
    file: ./secrets/download_proxy_auth
  repo_push_auth:
    file: ./secrets/repo_push_auth

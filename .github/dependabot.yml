---
# Weekly dependency updates, one pull request per ecosystem. update-center2's pin is not a package
# Dependabot can see: the Scheduled workflow's upstream-watch covers it. Every updater waits until a
# release is a week old (cooldown), so a compromised release is usually caught and pulled before
# Dependabot proposes it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
  # The base images are pinned by digest: the weekly pull request moves each to its tag's current
  # digest. A new Java, Maven or Apache major is a deliberate change, made by hand, never a weekly bump.
  - package-ecosystem: docker
    directories: [/uc, /web]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
      # Dependabot reads maven's tag as a version with the JDK as its build number
      # (3.9-eclipse-temurin-21 is 3.9.21), so a new Java looks like a patch: the tag stays, and only
      # its digest moves.
      - dependency-name: maven
        update-types: [version-update:semver-minor, version-update:semver-patch]
    groups:
      images:
        patterns: ['*']
  # The hooks in .pre-commit-config.yaml, pinned by commit.
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      lint-tools:
        patterns: ['*']
  # pre-commit itself (requirements-dev.txt).
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      pre-commit:
        patterns: ['*']

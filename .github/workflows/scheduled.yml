---
# Weekly, and by hand: the online integration test, which needs a Jenkins community account and so
# cannot run on pull requests, a watch on update-center2 releases
# (docs/development/upgrading-upstream.md), and a vulnerability scan of the latest release's images
# (docs/development/releasing.md#security-fixes-in-the-base-images).
name: Scheduled

on:
  schedule:
    - cron: '23 4 * * 1' # Mondays, 04:23 UTC
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  it-online:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check for the community account
        id: account
        env:
          USERNAME: ${{ secrets.JENKINS_COMMUNITY_USERNAME }}
          PASSWORD: ${{ secrets.JENKINS_COMMUNITY_PASSWORD }}
        run: |
          if [[ -n "${USERNAME}" && -n "${PASSWORD}" ]]; then
              echo "present=true" >> "${GITHUB_OUTPUT}"
          else
              message="it-online skipped: add the JENKINS_COMMUNITY_USERNAME and JENKINS_COMMUNITY_PASSWORD"
              message+=" repository secrets (docs/development/github-setup.md)"
              echo "::notice::${message}"
              echo "present=false" >> "${GITHUB_OUTPUT}"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.account.outputs.present == 'true'
        with:
          persist-credentials: false
      - name: make it-online
        if: steps.account.outputs.present == 'true'
        env:
          JENKINS_COMMUNITY_USERNAME: ${{ secrets.JENKINS_COMMUNITY_USERNAME }}
          JENKINS_COMMUNITY_PASSWORD: ${{ secrets.JENKINS_COMMUNITY_PASSWORD }}
        run: make it-online

  upstream-watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare update-center2 with the pin
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: .github/scripts/upstream-watch.sh

  image-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      packages: read
    env:
      UC_REPO: ghcr.io/haletechco/easy-update-center-uc
      WEB_REPO: ghcr.io/haletechco/easy-update-center-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every tag, for tools/release.py latest
          persist-credentials: false
      - name: Find the latest release
        id: release
        run: |
          version="$(python3 tools/release.py latest)"
          if [[ -z "${version}" ]]; then
              echo "::notice::image-scan skipped: nothing has been released yet"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      # The packages start private (docs/development/github-setup.md, step 8).
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.release.outputs.version != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Scan the uc image
        id: uc
        if: steps.release.outputs.version != ''
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ env.UC_REPO }}:${{ steps.release.outputs.version }}
          fail-build: false
          output-format: json
      - name: Scan the web image
        id: web
        if: steps.release.outputs.version != ''
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ env.WEB_REPO }}:${{ steps.release.outputs.version }}
          fail-build: false
          output-format: json
      - name: Open, update or close the issue
        if: steps.release.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.release.outputs.version }}
          UC_REPORT: ${{ steps.uc.outputs.json }}
          WEB_REPORT: ${{ steps.web.outputs.json }}
        run: .github/scripts/image-scan.sh "${UC_REPO}:${VERSION}=${UC_REPORT}" "${WEB_REPO}:${VERSION}=${WEB_REPORT}"

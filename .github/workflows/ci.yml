---
# Every pull request and every push to main runs the checks contributors run locally
# (CONTRIBUTING.md#tests): the pre-commit hooks, make test's suites, make compose-check, and make
# it-airgapped for both repository types. The images are built once, with the GitHub Actions build
# cache, and every test job loads them; PREBUILT=1 tells make to use them instead of building.
# The Release workflow runs this one on the images it pushed (the uc-image and web-image inputs), so
# its suites test what ships. Every job checks out the commit of the event that started the run (for
# the Release workflow, the tag) and takes no ref as input: a run with main's caches that checked
# out any other commit could poison those caches. The ci job is the one check the branch ruleset
# requires (docs/development/github-setup.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      uc-image:
        description: The uc image to test, by digest (the Release workflow); empty builds it
        type: string
        default: ''
      web-image:
        description: The web image to test, by digest (the Release workflow); empty builds it
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pre-commit
        run: pip install -r requirements-dev.txt
      - name: pre-commit
        env:
          SKIP: zizmor
        run: pre-commit run --all-files --show-diff-on-failure
      # zizmor alone gets the token, for its online audits (known-vulnerable actions, impostor
      # commits); it only reads.
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: pre-commit run zizmor --all-files

  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read # the release's images, while they are private
    env:
      UC_IMAGE_UNDER_TEST: ${{ inputs.uc-image }}
      WEB_IMAGE_UNDER_TEST: ${{ inputs.web-image }}
    steps:
      # The steps below choose by uc-image alone: one image under test and the other built here
      # would test a pair that never ships.
      - name: Check the image inputs
        run: |
          if [[ "${UC_IMAGE_UNDER_TEST:+given}" != "${WEB_IMAGE_UNDER_TEST:+given}" ]]; then
              echo "::error::give both uc-image and web-image, or neither"
              exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: inputs.uc-image != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Pull the images under test
        if: inputs.uc-image != ''
        run: |
          docker pull --platform linux/amd64 "${UC_IMAGE_UNDER_TEST}"
          docker pull --platform linux/amd64 "${WEB_IMAGE_UNDER_TEST}"
          docker tag "${UC_IMAGE_UNDER_TEST}" easy-update-center/uc:local
          docker tag "${WEB_IMAGE_UNDER_TEST}" easy-update-center/web:local
      - name: Build the uc image
        if: inputs.uc-image == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: uc
          target: runtime
          tags: easy-update-center/uc:local
          load: true
          cache-from: type=gha,scope=uc
          cache-to: type=gha,mode=max,scope=uc
      - name: Build the uc test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: uc
          target: test
          build-args: RUNTIME_IMAGE=${{ inputs.uc-image || 'runtime' }}
          tags: easy-update-center/uc-test:local
          load: true
          cache-from: |
            type=gha,scope=uc
            type=gha,scope=uc-test
          cache-to: type=gha,mode=max,scope=uc-test
      - name: Build the web image
        if: inputs.web-image == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: web
          tags: easy-update-center/web:local
          load: true
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Save the images
        run: docker save easy-update-center/uc:local easy-update-center/uc-test:local easy-update-center/web:local | gzip -1 > "${RUNNER_TEMP}/images.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images
          path: ${{ runner.temp }}/images.tar.gz
          # A day, except for the Release workflow's run: its failed jobs can be re-run for 7 days.
          retention-days: ${{ inputs.uc-image != '' && 7 || 1 }}
          compression-level: 0
          if-no-files-found: error

  test:
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [test-unit, test-web, test-routing, test-setup, compose-check]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images
          path: ${{ runner.temp }}
      - name: Load the images
        run: gunzip -c "${RUNNER_TEMP}/images.tar.gz" | docker load
      - name: make ${{ matrix.target }}
        env:
          TARGET: ${{ matrix.target }}
        run: make "${TARGET}" PREBUILT=1

  # A run takes about 3 minutes; the limit ends a stuck one well before it holds up a release.
  it-airgapped:
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        type: [artifactory, artifact-keeper]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images
          path: ${{ runner.temp }}
      - name: Load the images
        run: gunzip -c "${RUNNER_TEMP}/images.tar.gz" | docker load
      - name: make it-airgapped IT_TYPES=${{ matrix.type }}
        env:
          IT_TYPE: ${{ matrix.type }}
        run: make it-airgapped PREBUILT=1 IT_TYPES="${IT_TYPE}"

  # The one check the branch ruleset requires: it fails unless every job above succeeded, so a
  # skipped or cancelled job cannot let a pull request through.
  ci:
    needs: [lint, images, test, it-airgapped]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          read -ra results <<< "${RESULTS}"
          for result in "${results[@]}"; do
              if [[ "${result}" != success ]]; then
                  echo "::error::a CI job ended with ${result}: see the jobs above"
                  exit 1
              fi
          done
          echo "every CI job succeeded"

---
# Publishes a release when its tag is pushed (docs/development/releasing.md). The maintainer merges
# the release pull request `tools/release.py prepare VERSION` made, then pushes the tag vVERSION on
# that commit of main: X.Y.Z for a release, X.Y.Z-rc.N for a release candidate.
#
# Nothing anyone can pull or download changes until the last job:
#   images  builds each architecture without cache and pushes it by digest;
#   index   joins them into one index per image, under a build tag only;
#   ci      runs the CI workflow against those exact images;
#   sign    signs and attests them by digest;
#   bundle  builds the air-gapped bundles from the signed digests;
#   draft   writes the assets and a draft Release;
#   publish tags the images (X.Y.Z, plus X.Y and latest for a release) and publishes it.
# A failed run is finished with "Re-run failed jobs"; a published release is never changed
# (Immutable Releases, docs/development/github-setup.md).
#
# No token here can push to main or create a release tag: the tag ruleset lets only admins push them.
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  UC_REPO: ghcr.io/haletechco/easy-update-center-uc
  WEB_REPO: ghcr.io/haletechco/easy-update-center-web
  SOURCE_URL: https://github.com/HaleTechCo/easy-update-center

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every tag and main, for the checks below
          persist-credentials: false
      - name: Check the tag
        id: check
        run: |
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
              echo "::error::${GITHUB_REF_NAME} is not on main: tag the merged release commit"
              exit 1
          fi
          python3 tools/release.py check "${GITHUB_REF_NAME#v}" | tee -a "${GITHUB_OUTPUT}"

  # No build cache: every release builds from scratch, so it gets the distribution's current
  # packages even when the Dockerfiles are unchanged, and nothing cached can reach a release.
  images:
    needs: check
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push the uc image by digest
        id: uc
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: uc
          target: runtime
          platforms: ${{ matrix.platform }}
          build-args: UC_VERSION=${{ env.VERSION }}
          labels: |
            org.opencontainers.image.title=Easy Update Center for Jenkins: uc
            org.opencontainers.image.description=Generates, signs and publishes the update center (update-center2, patched)
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ env.SOURCE_URL }}
            org.opencontainers.image.licenses=MIT
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.UC_REPO }},push-by-digest=true,name-canonical=true,push=true
      - name: Build and push the web image by digest
        id: web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: web
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.title=Easy Update Center for Jenkins: web
            org.opencontainers.image.description=Serves the update center (Apache httpd)
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ env.SOURCE_URL }}
            org.opencontainers.image.licenses=MIT
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.WEB_REPO }},push-by-digest=true,name-canonical=true,push=true
      - name: Record the digests
        env:
          UC_DIGEST: ${{ steps.uc.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        run: |
          mkdir -p digests/uc digests/web
          touch "digests/uc/${UC_DIGEST#sha256:}" "digests/web/${WEB_DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: digests
          retention-days: 7
          if-no-files-found: error

  # One index per image, under a build tag only: no version, X.Y or latest tag exists until publish.
  index:
    needs: [check, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    outputs:
      uc-digest: ${{ steps.merge.outputs.uc-digest }}
      web-digest: ${{ steps.merge.outputs.web-digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Create the multi-architecture indexes
        id: merge
        run: |
          # One digest per platform: a stray one from an earlier attempt would give an index with
          # two manifests for one platform.
          shopt -s nullglob
          for image in uc web; do
              found=("digests/${image}"/*)
              if [[ "${#found[@]}" -ne 2 ]]; then
                  echo "::error::expected 2 ${image} digests, one per platform, found ${#found[@]}: ${found[*]##*/}"
                  exit 1
              fi
          done
          for image in uc web; do
              if [[ "${image}" == uc ]]; then repo="${UC_REPO}"; else repo="${WEB_REPO}"; fi
              sources=()
              for digest in "digests/${image}"/*; do sources+=("${repo}@sha256:${digest##*/}"); done
              docker buildx imagetools create --tag "${repo}:build-${GITHUB_SHA}" \
                  --annotation "index:org.opencontainers.image.source=${SOURCE_URL}" \
                  --annotation "index:org.opencontainers.image.version=${VERSION}" \
                  --annotation "index:org.opencontainers.image.licenses=MIT" \
                  "${sources[@]}"
              digest="$(docker buildx imagetools inspect "${repo}:build-${GITHUB_SHA}" --format '{{.Manifest.Digest}}')"
              echo "${image}-digest=${digest}" >> "${GITHUB_OUTPUT}"
          done

  # The CI workflow against the exact images this run pushed (linux/amd64, as CI runs).
  ci:
    needs: [check, index]
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/ci.yml
    with:
      uc-image: ghcr.io/haletechco/easy-update-center-uc@${{ needs.index.outputs.uc-digest }}
      web-image: ghcr.io/haletechco/easy-update-center-web@${{ needs.index.outputs.web-digest }}

  sign:
    needs: [check, index, ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Sign the images
        env:
          UC_DIGEST: ${{ needs.index.outputs.uc-digest }}
          WEB_DIGEST: ${{ needs.index.outputs.web-digest }}
        run: cosign sign --yes "${UC_REPO}@${UC_DIGEST}" "${WEB_REPO}@${WEB_DIGEST}"
      - name: Attest the uc image's build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.UC_REPO }}
          subject-digest: ${{ needs.index.outputs.uc-digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest the web image's build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.WEB_REPO }}
          subject-digest: ${{ needs.index.outputs.web-digest }}
          push-to-registry: true
          create-storage-record: false
      # syft reads the manifest list's linux/amd64 image (the runner's platform).
      - name: SBOM of the uc image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.UC_REPO }}@${{ needs.index.outputs.uc-digest }}
          format: spdx-json
          output-file: easy-update-center-uc-${{ env.VERSION }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: SBOM of the web image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.WEB_REPO }}@${{ needs.index.outputs.web-digest }}
          format: spdx-json
          output-file: easy-update-center-web-${{ env.VERSION }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest the uc image's SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.UC_REPO }}
          subject-digest: ${{ needs.index.outputs.uc-digest }}
          sbom-path: easy-update-center-uc-${{ env.VERSION }}.spdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Attest the web image's SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.WEB_REPO }}
          subject-digest: ${{ needs.index.outputs.web-digest }}
          sbom-path: easy-update-center-web-${{ env.VERSION }}.spdx.json
          push-to-registry: true
          create-storage-record: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sboms
          path: '*.spdx.json'
          retention-days: 7
          if-no-files-found: error

  # Each bundle is built on its own architecture's runner, from the signed digests, so docker pull
  # and docker save handle that architecture's images only.
  bundle:
    needs: [check, index, sign]
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      VERSION: ${{ needs.check.outputs.version }}
      UC_DIGEST: ${{ needs.index.outputs.uc-digest }}
      WEB_DIGEST: ${{ needs.index.outputs.web-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build the air-gapped bundle
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          name="easy-update-center-${VERSION}-airgapped-${ARCH}"
          mkdir -p "bundle/${name}" assets
          docker pull "${UC_REPO}@${UC_DIGEST}"
          docker pull "${WEB_REPO}@${WEB_DIGEST}"
          # compose.yaml names the images by version: tag the signed digests so for docker load
          docker tag "${UC_REPO}@${UC_DIGEST}" "${UC_REPO}:${VERSION}"
          docker tag "${WEB_REPO}@${WEB_DIGEST}" "${WEB_REPO}:${VERSION}"
          docker save --output "bundle/${name}/images.tar" "${UC_REPO}:${VERSION}" "${WEB_REPO}:${VERSION}"
          git archive --format=tar.gz --prefix="easy-update-center-${VERSION}/" --output="bundle/${name}/easy-update-center-${VERSION}.tar.gz" HEAD
          sed -e "s/@VERSION@/${VERSION}/g" -e "s/@ARCH@/${ARCH}/g" .github/release/airgapped-README.txt > "bundle/${name}/README.txt"
          tar --create --file "assets/${name}.tar" --directory bundle "${name}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-${{ matrix.arch }}
          path: assets
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

  draft:
    needs: [check, sign, bundle]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bundle-*
          path: assets
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sboms
          path: assets
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Check the asset sizes
        run: |
          too_big="$(find assets -type f -size +2147483647c)"
          if [[ -n "${too_big}" ]]; then
              echo "::error::over GitHub's 2 GiB limit for a Release asset, so no Release was created: ${too_big}"
              exit 1
          fi
      - name: Write and sign SHA256SUMS
        working-directory: assets
        run: |
          sha256sum -- *.tar *.spdx.json > SHA256SUMS
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      # A draft is invisible to everyone but maintainers until publish, and can be changed until
      # then: a re-run updates it. A published release is never changed.
      - name: Create or update the draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          python3 tools/release.py notes "${VERSION}" > "${RUNNER_TEMP}/notes.md"
          # Only "release not found" means there is none: any other failure (network,
          # authentication) must not create a second draft for the tag.
          if draft="$(gh release view "v${VERSION}" --json isDraft --jq .isDraft 2> "${RUNNER_TEMP}/view.err")"; then
              if [[ "${draft}" != true ]]; then
                  echo "::error::v${VERSION} is already published, and a published release is never changed: release the next version"
                  exit 1
              fi
              gh release edit "v${VERSION}" --notes-file "${RUNNER_TEMP}/notes.md"
              gh release upload "v${VERSION}" assets/* --clobber
          elif grep -qFx 'release not found' "${RUNNER_TEMP}/view.err"; then
              flags=(--draft --verify-tag --title "${VERSION}" --notes-file "${RUNNER_TEMP}/notes.md")
              if [[ "${PRERELEASE}" == true ]]; then flags+=(--prerelease); fi
              gh release create "v${VERSION}" "${flags[@]}" assets/*
          else
              echo "::error::cannot tell whether v${VERSION} has a Release: $(cat "${RUNNER_TEMP}/view.err")"
              exit 1
          fi

  publish:
    needs: [check, index, draft]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      PRERELEASE: ${{ needs.check.outputs.prerelease }}
    steps:
      # gh release edit below publishes whichever draft gh finds for the tag, and a published
      # release is never changed: so first make sure there is one, still a draft, with exactly
      # the six expected assets.
      - name: Check the draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api --paginate "repos/${GH_REPO}/releases?per_page=100" > "${RUNNER_TEMP}/releases.json"
          jq --slurp --arg tag "v${VERSION}" '[.[][] | select(.tag_name == $tag)]' "${RUNNER_TEMP}/releases.json" > "${RUNNER_TEMP}/tagged.json"
          count="$(jq length "${RUNNER_TEMP}/tagged.json")"
          if [[ "${count}" -ne 1 ]]; then
              echo "::error::v${VERSION} has ${count} Releases, not exactly one: delete any extra drafts, then re-run the draft job"
              exit 1
          fi
          if [[ "$(jq '.[0].draft' "${RUNNER_TEMP}/tagged.json")" != true ]]; then
              echo "::error::v${VERSION} is already published: if this run published it, the release is done; otherwise release the next version"
              exit 1
          fi
          assets="$(jq --raw-output '[.[0].assets[].name] | sort | join(" ")' "${RUNNER_TEMP}/tagged.json")"
          names=(
              "easy-update-center-${VERSION}-airgapped-amd64.tar"
              "easy-update-center-${VERSION}-airgapped-arm64.tar"
              "easy-update-center-uc-${VERSION}.spdx.json"
              "easy-update-center-web-${VERSION}.spdx.json"
              SHA256SUMS
              SHA256SUMS.sigstore.json
          )
          expected="$(printf '%s\n' "${names[@]}" | LC_ALL=C sort | paste -sd ' ' -)"
          if [[ "${assets}" != "${expected}" ]]; then
              echo "::error::the draft of v${VERSION} has the assets [${assets}], not [${expected}]: re-run the draft job"
              exit 1
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # One source and no annotations: the tag names the signed index as it is. Any other digest
      # stops the run before the Release is published. Each tag for both images before the next
      # tag: X.Y.Z first, so a failure there never leaves X.Y or latest naming a mixed pair. A
      # mismatch at a later tag stops the run with the earlier tags good and needs the manual
      # recovery in docs/development/releasing.md.
      - name: Tag the images
        env:
          UC_DIGEST: ${{ needs.index.outputs.uc-digest }}
          WEB_DIGEST: ${{ needs.index.outputs.web-digest }}
        run: |
          tags=("${VERSION}")
          if [[ "${PRERELEASE}" == false ]]; then tags+=("${VERSION%.*}" latest); fi
          for tag in "${tags[@]}"; do
              for image in uc web; do
                  if [[ "${image}" == uc ]]; then repo="${UC_REPO}" digest="${UC_DIGEST}"; else repo="${WEB_REPO}" digest="${WEB_DIGEST}"; fi
                  docker buildx imagetools create --tag "${repo}:${tag}" "${repo}@${digest}"
                  got="$(docker buildx imagetools inspect "${repo}:${tag}" --format '{{.Manifest.Digest}}')"
                  if [[ "${got}" != "${digest}" ]]; then
                      echo "::error::${repo}:${tag} is ${got}, not the signed ${digest}"
                      exit 1
                  fi
              done
          done
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          latest=false
          if [[ "${PRERELEASE}" == false ]]; then latest=true; fi
          gh release edit "v${VERSION}" --draft=false --latest="${latest}"

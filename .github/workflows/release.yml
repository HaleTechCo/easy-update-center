---
# Cuts a release by hand (docs/development/releasing.md): Actions > Release > Run workflow on main,
# with the version. check refuses a version that must not be published; ci runs the CI workflow on
# that commit; prepare moves CHANGELOG.md's Unreleased entries under the version and pushes the
# commit "Release X.Y.Z" and the tag vX.Y.Z to main together (the rulesets let the GitHub Actions
# app bypass them); images, manifests, sign, bundle and release publish the signed uc and web images
# for linux/amd64 and linux/arm64 on GHCR, an air-gapped bundle per architecture, and the GitHub
# Release. publish-only republishes an existing tag without touching CHANGELOG.md.
#
# Only prepare and release hold contents: write: the rulesets' bypass names the whole GitHub
# Actions app, so any job holding it could push to main. tests/unit/test_workflows.py keeps these
# workflows to that, but the real limit is who has write access (a branch can carry its own workflow).
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, X.Y.Z (CHANGELOG.md's Unreleased entries go under it)
        required: true
        type: string
      publish-only:
        description: Republish the existing vX.Y.Z (images, bundles, Release) without touching CHANGELOG.md
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  VERSION: ${{ inputs.version }}
  UC_REPO: ghcr.io/haletechco/easy-update-center-uc
  WEB_REPO: ghcr.io/haletechco/easy-update-center-web
  SOURCE_URL: https://github.com/HaleTechCo/easy-update-center

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      latest: ${{ steps.check.outputs.latest }}
      minor_latest: ${{ steps.check.outputs.minor_latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every tag, for tools/release.py check
          persist-credentials: false
      - name: Check the version
        id: check
        env:
          PUBLISH_ONLY: ${{ inputs.publish-only }}
        run: |
          if [[ "${GITHUB_REF}" != refs/heads/main ]]; then
              echo "::error::run the Release workflow on main, not ${GITHUB_REF}"
              exit 1
          fi
          args=(check "${VERSION}")
          if [[ "${PUBLISH_ONLY}" == true ]]; then
              args+=(--publish-only)
          fi
          python3 tools/release.py "${args[@]}" | tee -a "${GITHUB_OUTPUT}"

  ci:
    needs: check
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.publish-only && format('refs/tags/v{0}', inputs.version) || github.sha }}

  prepare:
    needs: ci
    if: ${{ !inputs.publish-only }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Keeps the token (persist-credentials defaults to true): this job pushes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Commit the release and tag it
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 tools/release.py prepare "${VERSION}"
          git commit --quiet --all --message "Release ${VERSION}"
          git tag --annotate "v${VERSION}" --message "Release ${VERSION}"
          # One atomic push: if main moved since this run started, neither the commit nor the tag lands.
          git push --atomic origin "HEAD:refs/heads/main" "refs/tags/v${VERSION}"

  images:
    needs: [ci, prepare]
    if: ${{ !failure() && !cancelled() }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/v${{ inputs.version }}
          persist-credentials: false
      - name: Find the release commit
        id: commit
        run: |
          sha="$(git rev-parse HEAD)"
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push the uc image by digest
        id: uc
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: uc
          target: runtime
          platforms: ${{ matrix.platform }}
          build-args: UC_VERSION=${{ inputs.version }}
          labels: |
            org.opencontainers.image.title=Easy Update Center for Jenkins: uc
            org.opencontainers.image.description=Generates, signs and publishes the update center (update-center2, patched)
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ steps.commit.outputs.sha }}
            org.opencontainers.image.source=${{ env.SOURCE_URL }}
            org.opencontainers.image.licenses=MIT
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.UC_REPO }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=release-uc-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-uc-${{ matrix.arch }}
      - name: Build and push the web image by digest
        id: web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: web
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.title=Easy Update Center for Jenkins: web
            org.opencontainers.image.description=Serves the update center (Apache httpd)
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ steps.commit.outputs.sha }}
            org.opencontainers.image.source=${{ env.SOURCE_URL }}
            org.opencontainers.image.licenses=MIT
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.WEB_REPO }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=release-web-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-web-${{ matrix.arch }}
      - name: Record the digests
        env:
          UC_DIGEST: ${{ steps.uc.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        run: |
          mkdir -p digests/uc digests/web
          touch "digests/uc/${UC_DIGEST#sha256:}" "digests/web/${WEB_DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: digests
          retention-days: 1
          if-no-files-found: error

  manifests:
    needs: [check, images]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      uc-digest: ${{ steps.merge.outputs.uc-digest }}
      web-digest: ${{ steps.merge.outputs.web-digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # X.Y moves only for the highest release in X.Y, latest only for the highest release overall
      # (tools/release.py check), so republishing an older release leaves both where they are.
      - name: Create the multi-architecture manifest lists
        id: merge
        env:
          LATEST: ${{ needs.check.outputs.latest }}
          MINOR_LATEST: ${{ needs.check.outputs.minor_latest }}
        run: |
          for image in uc web; do
              if [[ "${image}" == uc ]]; then repo="${UC_REPO}"; else repo="${WEB_REPO}"; fi
              tags=(--tag "${repo}:${VERSION}")
              if [[ "${MINOR_LATEST}" == true ]]; then tags+=(--tag "${repo}:${VERSION%.*}"); fi
              if [[ "${LATEST}" == true ]]; then tags+=(--tag "${repo}:latest"); fi
              sources=()
              for digest in "digests/${image}"/*; do sources+=("${repo}@sha256:${digest##*/}"); done
              docker buildx imagetools create "${tags[@]}" \
                  --annotation "index:org.opencontainers.image.source=${SOURCE_URL}" \
                  --annotation "index:org.opencontainers.image.version=${VERSION}" \
                  --annotation "index:org.opencontainers.image.licenses=MIT" \
                  "${sources[@]}"
              digest="$(docker buildx imagetools inspect "${repo}:${VERSION}" --format '{{.Manifest.Digest}}')"
              echo "${image}-digest=${digest}" >> "${GITHUB_OUTPUT}"
          done

  sign:
    needs: manifests
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Sign the images
        env:
          UC_DIGEST: ${{ needs.manifests.outputs.uc-digest }}
          WEB_DIGEST: ${{ needs.manifests.outputs.web-digest }}
        run: cosign sign --yes "${UC_REPO}@${UC_DIGEST}" "${WEB_REPO}@${WEB_DIGEST}"
      - name: Attest the uc image's build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.UC_REPO }}
          subject-digest: ${{ needs.manifests.outputs.uc-digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest the web image's build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.WEB_REPO }}
          subject-digest: ${{ needs.manifests.outputs.web-digest }}
          push-to-registry: true
          create-storage-record: false
      # syft reads the manifest list's linux/amd64 image (the runner's platform).
      - name: SBOM of the uc image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.UC_REPO }}@${{ needs.manifests.outputs.uc-digest }}
          format: spdx-json
          output-file: easy-update-center-uc-${{ inputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: SBOM of the web image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.WEB_REPO }}@${{ needs.manifests.outputs.web-digest }}
          format: spdx-json
          output-file: easy-update-center-web-${{ inputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest the uc image's SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.UC_REPO }}
          subject-digest: ${{ needs.manifests.outputs.uc-digest }}
          sbom-path: easy-update-center-uc-${{ inputs.version }}.spdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Attest the web image's SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.WEB_REPO }}
          subject-digest: ${{ needs.manifests.outputs.web-digest }}
          sbom-path: easy-update-center-web-${{ inputs.version }}.spdx.json
          push-to-registry: true
          create-storage-record: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sboms
          path: '*.spdx.json'
          retention-days: 1
          if-no-files-found: error

  # Each bundle is built on its own architecture's runner, so docker pull and docker save handle
  # that architecture's images only.
  bundle:
    needs: sign
    if: ${{ !failure() && !cancelled() }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/v${{ inputs.version }}
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build the air-gapped bundle
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          name="easy-update-center-${VERSION}-airgapped-${ARCH}"
          mkdir -p "bundle/${name}" assets
          docker pull "${UC_REPO}:${VERSION}"
          docker pull "${WEB_REPO}:${VERSION}"
          docker save --output "bundle/${name}/images.tar" "${UC_REPO}:${VERSION}" "${WEB_REPO}:${VERSION}"
          git archive --format=tar.gz --prefix="easy-update-center-${VERSION}/" --output="bundle/${name}/easy-update-center-${VERSION}.tar.gz" HEAD
          sed -e "s/@VERSION@/${VERSION}/g" -e "s/@ARCH@/${ARCH}/g" .github/release/airgapped-README.txt > "bundle/${name}/README.txt"
          tar --create --file "assets/${name}.tar" --directory bundle "${name}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-${{ matrix.arch }}
          path: assets
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  release:
    needs: [check, sign, bundle]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/v${{ inputs.version }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bundle-*
          path: assets
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sboms
          path: assets
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Check the asset sizes
        run: |
          too_big="$(find assets -type f -size +2147483647c)"
          if [[ -n "${too_big}" ]]; then
              echo "::error::over GitHub's 2 GiB limit for a Release asset, so no Release was created: ${too_big}"
              exit 1
          fi
      - name: Write and sign SHA256SUMS
        working-directory: assets
        run: |
          sha256sum -- *.tar *.spdx.json > SHA256SUMS
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PUBLISH_ONLY: ${{ inputs.publish-only }}
          LATEST: ${{ needs.check.outputs.latest }}
        run: |
          python3 tools/release.py notes "${VERSION}" > "${RUNNER_TEMP}/notes.md"
          if [[ "${PUBLISH_ONLY}" == true ]] && gh release view "v${VERSION}" > /dev/null 2>&1; then
              gh release edit "v${VERSION}" --notes-file "${RUNNER_TEMP}/notes.md"
              gh release upload "v${VERSION}" assets/* --clobber
          else
              gh release create "v${VERSION}" --verify-tag --title "${VERSION}" --notes-file "${RUNNER_TEMP}/notes.md" --latest="${LATEST}" assets/*
          fi

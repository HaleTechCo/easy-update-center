---
# Publishes a release when its tag is pushed (docs/development/releasing.md). The maintainer merges
# the release pull request `tools/release.py prepare X.Y.Z` made, then pushes the tag vX.Y.Z on that
# commit of main. check refuses a tag that must not be published; ci runs the CI workflow on the
# tagged commit; images, manifests, sign, bundle and release publish the signed uc and web images for
# linux/amd64 and linux/arm64 on GHCR, an air-gapped bundle per architecture, and the GitHub Release.
# Run by hand on an existing tag (Run workflow, "Use workflow from" the tag), it publishes that
# release again, with that tag's own workflow, so every signature names the tag.
#
# No token here can push to main or create a tag: the tag ruleset lets only admins push release
# tags, and only the release job's own token writes contents, to create the GitHub Release on the
# tag that exists (docs/development/github-setup.md).
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  UC_REPO: ghcr.io/haletechco/easy-update-center-uc
  WEB_REPO: ghcr.io/haletechco/easy-update-center-web
  SOURCE_URL: https://github.com/HaleTechCo/easy-update-center

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
      latest: ${{ steps.check.outputs.latest }}
      minor_latest: ${{ steps.check.outputs.minor_latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every tag and main, for the checks below
          persist-credentials: false
      - name: Check the tag
        id: check
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" != tag ]]; then
              echo "::error::run the Release workflow on a release tag, not ${GITHUB_REF}"
              exit 1
          fi
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
              echo "::error::${GITHUB_REF_NAME} is not on main: tag the merged release commit"
              exit 1
          fi
          args=(check "${GITHUB_REF_NAME#v}")
          if [[ "${EVENT}" == workflow_dispatch ]]; then
              args+=(--republish)
          fi
          python3 tools/release.py "${args[@]}" | tee -a "${GITHUB_OUTPUT}"

  ci:
    needs: check
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.sha }}

  # No build cache: every release builds from scratch, so it gets the distribution's current
  # packages even when the Dockerfiles are unchanged, and nothing cached can reach a release.
  images:
    needs: [check, ci]
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push the uc image by digest
        id: uc
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: uc
          target: runtime
          platforms: ${{ matrix.platform }}
          build-args: UC_VERSION=${{ env.VERSION }}
          labels: |
            org.opencontainers.image.title=Easy Update Center for Jenkins: uc
            org.opencontainers.image.description=Generates, signs and publishes the update center (update-center2, patched)
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ env.SOURCE_URL }}
            org.opencontainers.image.licenses=MIT
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.UC_REPO }},push-by-digest=true,name-canonical=true,push=true
      - name: Build and push the web image by digest
        id: web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: web
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.title=Easy Update Center for Jenkins: web
            org.opencontainers.image.description=Serves the update center (Apache httpd)
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ env.SOURCE_URL }}
            org.opencontainers.image.licenses=MIT
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.WEB_REPO }},push-by-digest=true,name-canonical=true,push=true
      - name: Record the digests
        env:
          UC_DIGEST: ${{ steps.uc.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        run: |
          mkdir -p digests/uc digests/web
          touch "digests/uc/${UC_DIGEST#sha256:}" "digests/web/${WEB_DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: digests
          retention-days: 1
          if-no-files-found: error

  manifests:
    needs: [check, images]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    outputs:
      uc-digest: ${{ steps.merge.outputs.uc-digest }}
      web-digest: ${{ steps.merge.outputs.web-digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # X.Y moves only for the highest release in X.Y, latest only for the highest release overall
      # (tools/release.py check), so republishing an older release leaves both where they are.
      - name: Create the multi-architecture manifest lists
        id: merge
        env:
          LATEST: ${{ needs.check.outputs.latest }}
          MINOR_LATEST: ${{ needs.check.outputs.minor_latest }}
        run: |
          for image in uc web; do
              if [[ "${image}" == uc ]]; then repo="${UC_REPO}"; else repo="${WEB_REPO}"; fi
              tags=(--tag "${repo}:${VERSION}")
              if [[ "${MINOR_LATEST}" == true ]]; then tags+=(--tag "${repo}:${VERSION%.*}"); fi
              if [[ "${LATEST}" == true ]]; then tags+=(--tag "${repo}:latest"); fi
              sources=()
              for digest in "digests/${image}"/*; do sources+=("${repo}@sha256:${digest##*/}"); done
              docker buildx imagetools create "${tags[@]}" \
                  --annotation "index:org.opencontainers.image.source=${SOURCE_URL}" \
                  --annotation "index:org.opencontainers.image.version=${VERSION}" \
                  --annotation "index:org.opencontainers.image.licenses=MIT" \
                  "${sources[@]}"
              digest="$(docker buildx imagetools inspect "${repo}:${VERSION}" --format '{{.Manifest.Digest}}')"
              echo "${image}-digest=${digest}" >> "${GITHUB_OUTPUT}"
          done

  sign:
    needs: [check, manifests]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Sign the images
        env:
          UC_DIGEST: ${{ needs.manifests.outputs.uc-digest }}
          WEB_DIGEST: ${{ needs.manifests.outputs.web-digest }}
        run: cosign sign --yes "${UC_REPO}@${UC_DIGEST}" "${WEB_REPO}@${WEB_DIGEST}"
      - name: Attest the uc image's build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.UC_REPO }}
          subject-digest: ${{ needs.manifests.outputs.uc-digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest the web image's build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.WEB_REPO }}
          subject-digest: ${{ needs.manifests.outputs.web-digest }}
          push-to-registry: true
          create-storage-record: false
      # syft reads the manifest list's linux/amd64 image (the runner's platform).
      - name: SBOM of the uc image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.UC_REPO }}@${{ needs.manifests.outputs.uc-digest }}
          format: spdx-json
          output-file: easy-update-center-uc-${{ env.VERSION }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: SBOM of the web image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.WEB_REPO }}@${{ needs.manifests.outputs.web-digest }}
          format: spdx-json
          output-file: easy-update-center-web-${{ env.VERSION }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest the uc image's SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.UC_REPO }}
          subject-digest: ${{ needs.manifests.outputs.uc-digest }}
          sbom-path: easy-update-center-uc-${{ env.VERSION }}.spdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Attest the web image's SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.WEB_REPO }}
          subject-digest: ${{ needs.manifests.outputs.web-digest }}
          sbom-path: easy-update-center-web-${{ env.VERSION }}.spdx.json
          push-to-registry: true
          create-storage-record: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sboms
          path: '*.spdx.json'
          retention-days: 1
          if-no-files-found: error

  # Each bundle is built on its own architecture's runner, so docker pull and docker save handle
  # that architecture's images only.
  bundle:
    needs: [check, sign]
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build the air-gapped bundle
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          name="easy-update-center-${VERSION}-airgapped-${ARCH}"
          mkdir -p "bundle/${name}" assets
          docker pull "${UC_REPO}:${VERSION}"
          docker pull "${WEB_REPO}:${VERSION}"
          docker save --output "bundle/${name}/images.tar" "${UC_REPO}:${VERSION}" "${WEB_REPO}:${VERSION}"
          git archive --format=tar.gz --prefix="easy-update-center-${VERSION}/" --output="bundle/${name}/easy-update-center-${VERSION}.tar.gz" HEAD
          sed -e "s/@VERSION@/${VERSION}/g" -e "s/@ARCH@/${ARCH}/g" .github/release/airgapped-README.txt > "bundle/${name}/README.txt"
          tar --create --file "assets/${name}.tar" --directory bundle "${name}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-${{ matrix.arch }}
          path: assets
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  release:
    needs: [check, sign, bundle]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bundle-*
          path: assets
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sboms
          path: assets
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Check the asset sizes
        run: |
          too_big="$(find assets -type f -size +2147483647c)"
          if [[ -n "${too_big}" ]]; then
              echo "::error::over GitHub's 2 GiB limit for a Release asset, so no Release was created: ${too_big}"
              exit 1
          fi
      - name: Write and sign SHA256SUMS
        working-directory: assets
        run: |
          sha256sum -- *.tar *.spdx.json > SHA256SUMS
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      # A first run creates the Release; a run on a tag that already has one replaces its notes and
      # assets.
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LATEST: ${{ needs.check.outputs.latest }}
        run: |
          python3 tools/release.py notes "${VERSION}" > "${RUNNER_TEMP}/notes.md"
          if gh release view "v${VERSION}" > /dev/null 2>&1; then
              gh release edit "v${VERSION}" --notes-file "${RUNNER_TEMP}/notes.md"
              gh release upload "v${VERSION}" assets/* --clobber
          else
              gh release create "v${VERSION}" --verify-tag --title "${VERSION}" --notes-file "${RUNNER_TEMP}/notes.md" --latest="${LATEST}" assets/*
          fi

---
# Web-tier routing tests (spec §13). Run with `make test-routing`.
name: uc-routing

x-web: &web
  image: ${WEB_IMAGE:-jenkins-uc/web:local}
  read_only: true
  tmpfs:
    - /tmp
  depends_on:
    fixtures:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD", "/usr/local/bin/healthcheck.sh"]
    interval: 2s
    timeout: 3s
    retries: 30
    start_period: 1s

x-uc-test: &uc-test
  image: ${UC_TEST_IMAGE:-jenkins-uc/uc-test:local}
  user: "0:0"

services:
  fixtures:
    <<: *uc-test
    entrypoint: ["python3", "/tests/routing/build_fixtures.py", "/fixtures"]
    volumes:
      - fixtures:/fixtures
      - ../../tests:/tests:ro
      - ../../uc/uc:/opt/uc/python/uc:ro
      - ../../uc/templates:/opt/uc/templates:ro

  backend:
    <<: *uc-test
    entrypoint: ["python3", "/tests/routing/stub_backend.py", "9000"]
    volumes:
      - ../../tests:/tests:ro

  backend-tls:
    <<: *uc-test
    entrypoint: ["python3", "/tests/routing/stub_backend.py", "9443", "/tls/chain.pem", "/tls/leaf.key"]
    depends_on:
      fixtures:
        condition: service_completed_successfully
    volumes:
      - ../../tests:/tests:ro
      - {type: volume, source: fixtures, target: /tls, read_only: true, volume: {subpath: tls}}

  web-full:
    <<: *web
    environment: {MODE: online, PUBLIC_URL: "http://web-full:8080"}
    volumes:
      - {type: volume, source: fixtures, target: /data, read_only: true, volume: {subpath: full}}

  # PUBLIC_URL is not the container's own address: a TLS proxy or a remapped port in front of it.
  web-public:
    <<: *web
    environment: {MODE: online, PUBLIC_URL: "https://updates.example.com"}
    volumes:
      - {type: volume, source: fixtures, target: /data, read_only: true, volume: {subpath: full}}

  web-artifactory:
    <<: *web
    environment:
      MODE: airgapped
      PUBLIC_URL: "http://web-artifactory:8080"
      REPO_URL: "http://artifactory.internal/artifactory/"
      REPO_KEY: jenkins
    volumes:
      - {type: volume, source: fixtures, target: /data, read_only: true, volume: {subpath: artifactory}}

  web-keeper:
    <<: *web
    environment:
      MODE: airgapped
      PUBLIC_URL: "http://web-keeper:8080"
      REPO_TYPE: artifact-keeper
      REPO_URL: "http://keeper.internal/"
      REPO_KEY: jenkins
    volumes:
      - {type: volume, source: fixtures, target: /data, read_only: true, volume: {subpath: artifactory}}

  web-proxy:
    <<: *web
    environment:
      MODE: airgapped
      PUBLIC_URL: "http://web-proxy:8080"
      DOWNLOAD_ACCESS: proxy
      DOWNLOAD_BACKEND_URL: "http://backend:9000/repo"
    secrets:
      - download_proxy_auth
    volumes:
      - {type: volume, source: fixtures, target: /data, read_only: true, volume: {subpath: artifactory}}

  web-proxy-tls:
    <<: *web
    environment:
      MODE: airgapped
      PUBLIC_URL: "http://web-proxy-tls:8080"
      DOWNLOAD_ACCESS: proxy
      DOWNLOAD_BACKEND_URL: "https://backend-tls:9443/repo"
      DOWNLOAD_PROXY_CA_FILE: /tls/root.crt
    secrets:
      - download_proxy_auth
    volumes:
      - {type: volume, source: fixtures, target: /data, read_only: true, volume: {subpath: artifactory}}
      - {type: volume, source: fixtures, target: /tls, read_only: true, volume: {subpath: tls}}

  web-weekly:
    <<: *web
    environment: {MODE: online, PUBLIC_URL: "http://web-weekly:8080"}
    volumes:
      - {type: volume, source: fixtures, target: /data, read_only: true, volume: {subpath: weekly}}

  web-stable:
    <<: *web
    environment: {MODE: online, PUBLIC_URL: "http://web-stable:8080"}
    volumes:
      - {type: volume, source: fixtures, target: /data, read_only: true, volume: {subpath: stable}}

  web-zero:
    <<: *web
    environment: {MODE: online, PUBLIC_URL: "http://web-zero:8080"}
    volumes:
      - {type: volume, source: fixtures, target: /data, read_only: true, volume: {subpath: zero}}

  tester:
    <<: *uc-test
    entrypoint: ["python3", "-m", "pytest", "-p", "no:cacheprovider", "-q", "/tests/routing"]
    depends_on:
      backend: {condition: service_started}
      backend-tls: {condition: service_started}
      web-full: {condition: service_healthy}
      web-public: {condition: service_healthy}
      web-proxy-tls: {condition: service_healthy}
      web-artifactory: {condition: service_healthy}
      web-keeper: {condition: service_healthy}
      web-proxy: {condition: service_healthy}
      web-weekly: {condition: service_healthy}
      web-stable: {condition: service_healthy}
      web-zero: {condition: service_healthy}
    volumes:
      - fixtures:/fixtures
      - ../../tests:/tests:ro
      - ../../uc/uc:/opt/uc/python/uc:ro

volumes:
  fixtures:

secrets:
  download_proxy_auth:
    file: ./proxy-auth.txt

---
# Air-gapped integration test (CONTRIBUTING.md#tests). Run with `make it-airgapped`, which runs it
# once per repository type; tests/integration/types/<type>.env supplies the IT_* values for each.
name: uc-it-airgapped

networks:
  airgap:
    internal: true
  internet: {}

x-uc-test: &uc-test
  image: ${UC_TEST_IMAGE:-easy-update-center/uc-test:local}
  user: "0:0"

x-jenkins: &jenkins
  networks: [airgap]
  environment:
    JAVA_OPTS: "-Djenkins.install.runSetupWizard=false"
  volumes:
    - trust:/var/jenkins_home/update-center-rootCAs:ro
    - ./jenkins-init.groovy:/var/jenkins_home/init.groovy.d/uc-test.groovy:ro
  healthcheck:
    test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/login"]
    interval: 5s
    timeout: 5s
    retries: 60
    start_period: 20s

x-blocked-hosts: &blocked-hosts
  - "api.github.com:127.0.0.1"
  - "github.com:127.0.0.1"
  - "codeload.github.com:127.0.0.1"
  - "raw.githubusercontent.com:127.0.0.1"
  - "reports.jenkins.io:127.0.0.1"
  - "updates.jenkins.io:127.0.0.1"

services:
  # ---- seeding: profile "seed", internet access ----
  seed-versions:
    <<: *uc-test
    profiles: ["seed"]
    networks: [internet]
    entrypoint: ["python3", "/tests/integration/seed.py", "versions"]
    volumes:
      - ../../tests:/tests:ro
      - ../../uc/uc:/opt/uc/python/uc:ro

  # updates.jenkins.io sends each plugin download to a nearby mirror, and jenkins-plugin-cli has no
  # connect timeout: a mirror the runner cannot reach stalls every plugin for minutes. The time
  # limit ends such a run, and make it-airgapped downloads again from archives.jenkins.io, the
  # Jenkins project's reference server, which the mirrors fall back on too.
  seed-plugins:
    image: jenkins/jenkins:${LTS_OLD:-lts}
    profiles: ["seed"]
    user: "0:0"
    networks: [internet]
    entrypoint: ["timeout", "${SEED_PLUGINS_TIMEOUT:-300}", "jenkins-plugin-cli", "--plugins", "${SEED_PLUGINS:-timestamper}",
                 "--plugin-download-directory", "/seed/downloads"]
    volumes:
      - seed:/seed

  seed-repo:
    <<: *uc-test
    profiles: ["seed"]
    networks: [internet]
    entrypoint: ["python3", "/tests/integration/seed.py", "repo", "--downloads", "/seed/downloads",
                 "--out", "/seed/repo", "--repository", "jenkins",
                 "--cores", "${LTS_OLD:-x},${LTS_NEW:-x},${WEEKLY:-x}", "--jenkins-version", "${LTS_OLD:-x}", "--weekly", "${WEEKLY:-x}",
                 "--top-plugin", "${SEED_TOP_PLUGIN:-timestamper}"]
    volumes:
      - seed:/seed
      - ../../tests:/tests:ro
      - ../../uc/uc:/opt/uc/python/uc:ro

  pki:
    image: ${UC_IMAGE:-easy-update-center/uc:local}
    profiles: ["seed"]
    user: "0:0"
    environment: {UC_ALLOW_ROOT: "1"}
    network_mode: none
    entrypoint:
      - sh
      - -c
      - >-
        uc pki init --out /pki && cp /pki/root-ca.crt /trust/ &&
        printf uc > /pki/repo_username && printf uc-secret > /pki/repo_password &&
        printf uc:uc-secret > /pki/download_proxy_auth &&
        printf uc:uc-secret > /pki/repo_push_auth && chmod -R a+rX /pki /trust
    volumes:
      - pki:/pki
      - trust:/trust

  # ---- the air-gapped side: no route to the internet ----
  artifactory:
    <<: *uc-test
    networks: [airgap]
    entrypoint: ["python3", "/tests/integration/fake_artifactory.py", "--root", "/seed/repo", "--port", "8081",
                 "--credentials", "uc:uc-secret", "--anonymous-read"]
    volumes:
      - seed:/seed:ro
      - ../../tests:/tests:ro

  artifactory-private:
    <<: *uc-test
    networks: [airgap]
    entrypoint: ["python3", "/tests/integration/fake_artifactory.py", "--root", "/seed/repo", "--port", "8081",
                 "--credentials", "uc:uc-secret"]
    volumes:
      - seed:/seed:ro
      - ../../tests:/tests:ro

  keeper:
    <<: *uc-test
    networks: [airgap]
    entrypoint: ["python3", "/tests/integration/fake_artifact_keeper.py", "--root", "/seed/repo", "--port", "8081",
                 "--user", "uc", "--token", "uc-secret", "--anonymous-read"]
    volumes:
      - seed:/seed:ro
      - ../../tests:/tests:ro

  keeper-private:
    <<: *uc-test
    networks: [airgap]
    entrypoint: ["python3", "/tests/integration/fake_artifact_keeper.py", "--root", "/seed/repo", "--port", "8081",
                 "--user", "uc", "--token", "uc-secret"]
    volumes:
      - seed:/seed:ro
      - ../../tests:/tests:ro

  # ---- the procurement round trip: a fake repo.jenkins-ci.org, and a writable repository per type ----
  upstream:
    <<: *uc-test
    networks: [airgap]
    entrypoint: ["python3", "/tests/integration/fake_artifact_keeper.py", "--root", "/seed/upstream", "--port", "8081",
                 "--user", "unused", "--token", "unused", "--anonymous-read"]
    volumes:
      - seed:/seed:ro
      - ../../tests:/tests:ro

  push-init:
    <<: *uc-test
    profiles: ["seed"]
    network_mode: none
    entrypoint: ["sh", "-c", "rm -rf /push/* && cp -a /seed/push-template/. /push/"]
    volumes:
      - seed:/seed:ro
      - push-repo:/push

  keeper-push:
    <<: *uc-test
    networks: [airgap]
    entrypoint: ["python3", "/tests/integration/fake_artifact_keeper.py", "--root", "/push", "--port", "8081",
                 "--user", "uc", "--token", "uc-secret"]
    volumes:
      - push-repo:/push
      - ../../tests:/tests:ro

  artifactory-push:
    <<: *uc-test
    networks: [airgap]
    entrypoint: ["python3", "/tests/integration/fake_artifactory.py", "--root", "/push", "--port", "8081",
                 "--credentials", "uc:uc-secret"]
    volumes:
      - push-repo:/push
      - ../../tests:/tests:ro

  repo-adapter-push:
    <<: *uc-test
    env_file: uc.env
    networks: [airgap]
    extra_hosts: *blocked-hosts
    entrypoint: ["python3", "-m", "uc", "repo-adapter"]
    environment:
      REPO_TYPE: ${IT_REPO_TYPE:-artifactory}
      REPO_URL: ${IT_PUSH_URL:-http://artifactory-push:8081/artifactory/}
      REPO_KEY: procure  # wins over uc.env's jenkins
      DOWNLOAD_BACKEND_URL: ${IT_DOWNLOAD_PREFIX:-http://artifactory:8081/artifactory/jenkins/}
    healthcheck:
      test: ["CMD", "python3", "-m", "uc", "repo-adapter", "--healthcheck"]
      interval: 2s
      timeout: 5s
      retries: 30
    depends_on:
      keeper-push: {condition: service_started}
      artifactory-push: {condition: service_started}
    volumes:
      - repo-adapter-push-data:/data/repo-adapter
      - pki:/pki:ro
      - ../../uc/uc:/opt/uc/python/uc:ro

  repo-adapter:
    <<: *uc-test
    env_file: uc.env
    networks: [airgap]
    extra_hosts: *blocked-hosts
    entrypoint: ["python3", "-m", "uc", "repo-adapter"]
    environment:
      REPO_TYPE: ${IT_REPO_TYPE:-artifactory}
      REPO_URL: ${IT_ADAPTER_BACKEND_URL:-http://artifactory-private:8081/artifactory/}
      DOWNLOAD_BACKEND_URL: ${IT_DOWNLOAD_PREFIX:-http://artifactory:8081/artifactory/jenkins/}
    healthcheck:
      test: ["CMD", "python3", "-m", "uc", "repo-adapter", "--healthcheck"]
      interval: 2s
      timeout: 5s
      retries: 30
    depends_on:
      artifactory-private: {condition: service_started}
      keeper-private: {condition: service_started}
    volumes:
      - repo-adapter-data:/data/repo-adapter
      - pki:/pki:ro
      - ../../uc/uc:/opt/uc/python/uc:ro

  web:
    image: ${WEB_IMAGE:-easy-update-center/web:local}
    networks: [airgap]
    environment:
      PUBLIC_URL: "http://web:8080"
      MODE: airgapped
      DOWNLOAD_BACKEND_URL: ${IT_DOWNLOAD_PREFIX:-http://artifactory:8081/artifactory/jenkins/}
    volumes:
      - uc-data:/data:ro

  web-proxy:
    image: ${WEB_IMAGE:-easy-update-center/web:local}
    networks: [airgap]
    environment:
      DOWNLOAD_BACKEND: artifactory
      PUBLIC_URL: "http://web-proxy:8080"
      DOWNLOAD_ACCESS: proxy
      DOWNLOAD_BACKEND_URL: ${IT_PROXY_BACKEND_URL:-http://artifactory-private:8081/artifactory/jenkins}
    volumes:
      - uc-data-proxy:/data:ro
      - pki:/run/secrets:ro  # its download_proxy_auth, where web reads it

  jenkins-lts-old:
    <<: *jenkins
    image: jenkins/jenkins:${LTS_OLD:-lts}

  jenkins-lts-new:
    <<: *jenkins
    image: jenkins/jenkins:${LTS_NEW:-lts}

  jenkins-weekly:
    <<: *jenkins
    image: jenkins/jenkins:${WEEKLY:-latest}

  driver:
    <<: *uc-test
    env_file: uc.env
    networks: [airgap]
    extra_hosts: *blocked-hosts
    environment:
      REPO_TYPE: ${IT_REPO_TYPE:-artifactory}
      REPO_URL: ${IT_ADAPTER_BACKEND_URL:-http://artifactory-private:8081/artifactory/}
      REPO_ADAPTER_DIR: /data/repo-adapter  # also for runs with another UC_DATA_DIR
      DOWNLOAD_BACKEND_URL: ${IT_DOWNLOAD_PREFIX:-http://artifactory:8081/artifactory/jenkins/}
      DOWNLOAD_PREFIX: ${IT_DOWNLOAD_PREFIX:-http://artifactory:8081/artifactory/jenkins/}
      LTS_OLD: ${LTS_OLD:-x}
      LTS_NEW: ${LTS_NEW:-x}
      WEEKLY: ${WEEKLY:-x}
      SEED_TOP_PLUGIN: ${SEED_TOP_PLUGIN:-timestamper}
      PUSH_REPO_URL: ${IT_PUSH_URL:-http://artifactory-push:8081/artifactory/}
    entrypoint: ["python3", "-m", "pytest", "-p", "no:cacheprovider", "-q", "-x", "/tests/integration/test_airgapped.py"]
    depends_on:
      artifactory: {condition: service_started}
      keeper: {condition: service_started}
      repo-adapter: {condition: service_healthy}
      repo-adapter-push: {condition: service_healthy}
      upstream: {condition: service_started}
      web: {condition: service_started}
      web-proxy: {condition: service_started}
      jenkins-lts-old: {condition: service_healthy}
      jenkins-lts-new: {condition: service_healthy}
      jenkins-weekly: {condition: service_healthy}
    volumes:
      - uc-data:/data
      - repo-adapter-data:/data/repo-adapter:ro
      - uc-data-proxy:/data-proxy
      - uc-data-age:/data-age
      - uc-data-push:/data-push
      - repo-adapter-push-data:/data-push/repo-adapter:ro
      - pki:/pki:ro
      - seed:/seed:ro
      - ../../tests:/tests:ro
      - ../../uc/uc:/opt/uc/python/uc:ro

  plugin-cli:
    image: jenkins/jenkins:${LTS_NEW:-lts}
    networks: [airgap]
    user: "0:0"
    environment:
      JENKINS_UC: "http://web:8080"
      JENKINS_UC_EXPERIMENTAL: "http://web:8080/experimental"
      JENKINS_PLUGIN_INFO: "http://web:8080/current/plugin-versions.json"
    entrypoint: ["jenkins-plugin-cli", "--verbose", "--plugins", "${SEED_TOP_PLUGIN:-timestamper}",
                 "--plugin-download-directory", "/tmp/plugins"]

volumes:
  seed:
  pki:
  trust:
  uc-data:
  uc-data-proxy:
  uc-data-age:
  push-repo:
  uc-data-push:
  repo-adapter-data:
  repo-adapter-push-data:

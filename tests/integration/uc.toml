# make it-airgapped: the settings every uc process under test shares (driver, repo-adapters, web-config).
# Each service's environment adds the rest and overrides some, so every run reads both sources
# (docs/reference/configuration.md#how-settings-are-read).
mode = "airgapped"
public_url = "http://web:8080"
secrets_dir = "/pki"

[repo]
key = "jenkins"

[uc]
data_dir = "/data"

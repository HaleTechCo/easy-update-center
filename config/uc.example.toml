# Settings for the update center in online mode. Copy this file to config/uc.toml and edit the copy;
# a line starting with # is at its default, so remove the # to set it.
# Generated from the settings registry: `uc config --example toml --mode online` (make examples).
# A variable in .env wins over this file: [section] key is SECTION_KEY, and a top-level key is KEY.
# Every setting: docs/reference/configuration.md

# online or airgapped. It only sets defaults; every other setting can still be set explicitly. (MODE)
mode = "online"
# The exact origin Jenkins uses, with no path. (PUBLIC_URL)
public_url = "https://jenkins-updates.example.com"
# Plugin install counts. Set it empty to skip them; popularity is then 0. (POPULARITY_JSON_URL)
# popularity_json_url = "https://raw.githubusercontent.com/jenkins-infra/infra-statistics/gh-pages/plugin-installation-trend/latestNumbers.json"
# A directory listing of the updates/ tool-installer files. Set it empty to skip them. (TOOL_INSTALLERS_URL)
# tool_installers_url = "https://updates.jenkins.io/updates/"
# status.json marks the resources stale when they are older than this. (STALE_AFTER_DAYS)
# stale_after_days = 30
# Tiers are offered for cores released within this many days; 0 means every core a plugin requires. (CORE_AGE_DAYS)
# core_age_days = 400
# Releases kept for rollback. (RETAIN_RELEASES)
# retain_releases = 5
# A release with fewer plugins is refused. (MIN_PLUGINS)
# min_plugins = 1
# A release with fewer than this share of the live release's plugins is refused, unless run with uc generate --force. (MIN_PLUGIN_RATIO)
# min_plugin_ratio = 0.9
# Generation stops when the signing certificate expires within this many days. (CERTIFICATE_MINIMUM_VALID_DAYS)
# certificate_minimum_valid_days = 30
# Allows a localhost or loopback PUBLIC_URL, which controllers on other hosts cannot reach. Not for production. (ALLOW_LOCAL_PUBLIC_URL)
# allow_local_public_url = false
# The generator's JVM options: heap size (-Xmx6g) and outbound proxy (-Dhttps.proxyHost=... -Dhttps.proxyPort=...). (JAVA_TOOL_OPTIONS)
# java_tool_options = "-Xmx4g -Dhttps.proxyHost=proxy.example.com -Dhttps.proxyPort=3128"
# The outbound proxy for everything the generator does not fetch itself. Behind a proxy, set it and the proxy flags in JAVA_TOOL_OPTIONS. (HTTPS_PROXY)
# https_proxy = "http://proxy.example.com:3128"
# As HTTPS_PROXY, for plain-http URLs. (HTTP_PROXY)
# http_proxy = ""
# Hosts to reach directly. With a proxy set, include repo-adapter (and an internal repository host). (NO_PROXY)
# no_proxy = "repo-adapter"
# Where the secret files are read from. (SECRETS_DIR)
# secrets_dir = "/run/secrets"
# The root CA certificate, ${SECRETS_DIR}/root-ca.crt by default. (ROOT_CA_FILE)
# root_ca_file = ""

[generate]
# Cron expression for regular generation. The scheduler also generates at once when no release is live. (GENERATE_SCHEDULE)
# schedule = "0 */6 * * *"

[doctor]
# Cron expression for a read-only uc doctor --record run, which saves the report and its counts in status.json; empty means none. (DOCTOR_SCHEDULE)
# schedule = "30 5 * * *"
# uc doctor downloads the POMs and manifests missing from the cache, so it can check every dependency and required core (--fetch). (DOCTOR_FETCH)
# fetch = false
# The floor for required cores (--since); empty means the oldest core in the repository. (DOCTOR_SINCE)
# since = ""
# uc doctor prints its report as JSON (--json). (DOCTOR_JSON)
# json = false

[repo]
# artifactory or artifact-keeper. Artifact Keeper is read only through the repo-adapter. (REPO_TYPE)
# type = "artifactory"
# Artifactory: the /artifactory/ base URL; Artifact Keeper: the server's base URL. It defaults to https://repo.jenkins-ci.org/ only online with REPO_TYPE=artifactory. (REPO_URL)
# url = "https://artifactory.corp.example/artifactory/"
# Artifactory's API base for the listing query, ${REPO_URL}api/ by default. Set it only when the API is served elsewhere. (REPO_API_URL)
# api_url = ""
# The repository key (for Artifact Keeper, the key, not the display name). It defaults to releases only online with REPO_TYPE=artifactory. (REPO_KEY)
# key = "jenkins-plugins-local"
# Read the repository through the repo-adapter: on by default air-gapped and always with Artifact Keeper, off otherwise. (REPO_ADAPTER)
# adapter = true
# Where uc finds the repo-adapter. Change it only with a non-default Compose layout. (REPO_ADAPTER_URL)
# adapter_url = "http://repo-adapter:8081/artifactory/"
# The repo-adapter's token, cache and report.json, ${UC_DATA_DIR}/repo-adapter by default. (REPO_ADAPTER_DIR)
# adapter_dir = ""
# A PEM bundle added to the system bundle, for a repository behind a private CA. (REPO_CA_FILE)
# ca_file = "/etc/ssl/uc-repo-ca.crt"
# Archives larger than this are skipped and reported. (REPO_MAX_ARCHIVE_MB)
# max_archive_mb = 512
# The repository account, ${SECRETS_DIR}/repo_username by default. (REPO_USERNAME_FILE)
# username_file = ""
# The repository account's password or token, ${SECRETS_DIR}/repo_password by default. (REPO_PASSWORD_FILE)
# password_file = ""
# The account that can write to the repository, ${SECRETS_DIR}/repo_push_auth by default. (REPO_PUSH_AUTH_FILE)
# push_auth_file = ""

[download]
# mirror (the get.jenkins.io layout) or artifactory (any Maven-layout repository). (DOWNLOAD_BACKEND)
# backend = "mirror"
# Where /download/ requests go: https://get.jenkins.io for mirror, the repository (${REPO_URL}${REPO_KEY}; Artifact Keeper ${REPO_URL}maven/${REPO_KEY}) for artifactory. (DOWNLOAD_BACKEND_URL)
# backend_url = ""
# redirect sends controllers to the backend; proxy streams each file through the web container. (DOWNLOAD_ACCESS)
# Controllers cannot read the repository anonymously? Use proxy: docs/how-to/proxy-downloads.md
# access = "redirect"
# Proxy mode only: the CA bundle the backend's certificate must verify against. (DOWNLOAD_PROXY_CA_FILE)
# proxy_ca_file = "/etc/ssl/certs/ca-certificates.crt"
# Proxy mode only: the file holding username:password for the backend, ${SECRETS_DIR}/download_proxy_auth by default. (DOWNLOAD_PROXY_AUTH_FILE)
# proxy_auth_file = ""

[resources]
# Where security warnings, suspensions and labels come from: github (upstream at RESOURCES_REF), url (a tarball at RESOURCES_URL) or bundled (the copy in the image). (RESOURCES_SOURCE)
# source = "github"
# The update-center2 branch, tag or commit to read with RESOURCES_SOURCE=github. (RESOURCES_REF)
# ref = "master"
# Required with RESOURCES_SOURCE=url: a tarball containing resources/. (RESOURCES_URL)
# url = "https://artifactory.corp.example/artifactory/generic-local/update-center2-master.tar.gz"
# With RESOURCES_SOURCE=url, the tarball must match this checksum. (RESOURCES_SHA256)
# sha256 = ""

[tls]
# With TLS_KEY_FILE, enables HTTPS on port 8443: a path inside the web container. (TLS_CERT_FILE)
# cert_file = ""
# The private key for TLS_CERT_FILE. (TLS_KEY_FILE)
# key_file = ""

[procurement]
# Where uc doctor --download-* fetches files from, by Maven path; https://repo.jenkins-ci.org/releases/ by default. Air-gapped, downloads are refused unless it is set. (PROCUREMENT_SOURCE_URL)
# source_url = ""

[signing]
# Read and validated, but it has no effect today: uc pki sets the lifetime. (SIGNING_CERT_DAYS)
# cert_days = 365
# The signing key, ${SECRETS_DIR}/update-center.key by default. (SIGNING_KEY_FILE)
# key_file = ""
# The signing certificate, ${SECRETS_DIR}/update-center.cert by default. (SIGNING_CERT_FILE)
# cert_file = ""

[github]
# The GitHub user, ${SECRETS_DIR}/github_username by default. (GITHUB_USERNAME_FILE)
# username_file = ""
# The GitHub token, ${SECRETS_DIR}/github_token by default. (GITHUB_TOKEN_FILE)
# token_file = ""

[uc]
# The update site id written into the metadata; it must match the update site id on your controllers. (UC_ID)
# id = "default"
# Extra update-center2 arguments appended to every run, for example --max-plugins 25 to cap a trial run. (UC_EXTRA_ARGS)
# extra_args = ""
# The data volume. (UC_DATA_DIR)
# data_dir = "/data"
# The overlay directory, config/overlay/ on the host. (UC_OVERLAY_DIR)
# overlay_dir = "/config/overlay"
# The generator, templates and bundled resources in the image. (UC_APP_DIR)
# app_dir = "/opt/uc"

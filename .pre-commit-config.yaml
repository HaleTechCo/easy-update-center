---
# Pre-commit hooks for Easy Update Center for Jenkins. See https://pre-commit.com/.
#
# The hooks cover the file types this tree holds: the uc package, its tests and tools/ (ruff), the
# compose files and test stacks (yamllint, docker compose config), the two Dockerfiles (hadolint),
# the shell scripts (shellcheck, shfmt) and the workflows (actionlint, zizmor). They are strict:
# yamllint --strict, shellcheck enable=all / severity=style (see .shellcheckrc), ruff select=ALL
# (see ruff.toml), LF line endings enforced. A new file type gets its hook when it arrives.
#
# Each hook comes from its own repository, pinned to a commit (the "frozen" comment names the
# release; Dependabot proposes new ones). pre-commit installs each in its own environment on first
# use and caches it, so the only thing to install is pre-commit itself (requirements-dev.txt):
#   pip install -r requirements-dev.txt
#   pre-commit install                # run on every git commit
#   pre-commit run --all-files        # run now
# The `local` hooks at the end are this repository's own checks, in tools/ (tools/README.md).
#
# There is no test hook. The suites run in containers against images built from this tree, which is
# too slow for every commit; `make test` is the gate for behavior (see the Makefile).
#
# The docker-compose-config hooks need Docker and are skipped without it. hadolint does not: it is a
# pip-installed binary.
#
# Skip a single hook for one commit (never --no-verify, which skips the secret check too):
#   SKIP=ruff-check git commit ...

exclude: |
    (?x)^(
      \.git/|
      \.?venv[^/]*/|
      \.idea/|
      \.ruff_cache/|
      \.pytest_cache/|
      __pycache__/
    )

repos:
    # ── hygiene ─────────────────────────────────────────────────────────────────
    # The fixers that rewrite bytes (trailing-whitespace, end-of-file-fixer, mixed-line-ending, and
    # unicode-gremlins below) skip uc/patches/. Those are git patches applied to update-center2's
    # source at image build time: a blank context line in a patch is a single space, and every
    # context line has to match upstream byte for byte, so "cleaning" one makes `git apply` refuse
    # it.
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
      hooks:
          - id: trailing-whitespace
            exclude: '^uc/patches/'
          - id: end-of-file-fixer
            exclude: '^uc/patches/'
          # Edited on Windows, run in Linux containers: LF everywhere, so a stray CRLF can't break a
          # script. .gitattributes is the durable fix; this hook is the second line of defense.
          - id: mixed-line-ending
            args: ['--fix=lf']
            exclude: '^uc/patches/'
          # --unsafe: parse for syntax only, without constructing tags. compose.airgapped.yaml uses
          # Compose's `!override` merge tag, which a plain YAML loader rejects outright. yamllint and
          # the docker-compose-config hooks still check the files properly.
          - id: check-yaml
            args: ['--unsafe']
          - id: check-toml
          - id: check-json
          - id: check-xml
          - id: check-merge-conflict
          # One 500 KB cap. If the tree ever tracks a large fixture, add a second, scoped hook with a
          # bigger --maxkb rather than raising this one.
          - id: check-added-large-files
            args: ['--maxkb=500']
          - id: check-ast
          - id: check-executables-have-shebangs
          - id: check-shebang-scripts-are-executable
          - id: check-case-conflict
          - id: check-symlinks
          - id: destroyed-symlinks
          - id: forbid-new-submodules
          - id: debug-statements
          - id: pretty-format-json
            args: ['--autofix', '--no-sort-keys', '--no-ensure-ascii', '--indent=4']
          # PEM `BEGIN ... PRIVATE KEY` blocks, such as the signing key in secrets/.
          - id: detect-private-key

    # ── shell ───────────────────────────────────────────────────────────────────
    # Matched by type, so a shell script anywhere is covered, extensionless ones like uc/bin/uc
    # included. shfmt: -i 4 (4-space indent), -sr (space after redirect), -ci (indent switch cases),
    # -bn (binary ops may start a line), -w (write in place).
    - repo: https://github.com/scop/pre-commit-shfmt
      rev: 479be5958357ba5ab65ce47172117348516860e9 # frozen: v3.14.1-1
      hooks:
          - id: shfmt
            args: ['-i', '4', '-sr', '-ci', '-bn', '-w']
    # Severity and enabled checks come from .shellcheckrc; --color has no rc equivalent.
    - repo: https://github.com/shellcheck-py/shellcheck-py
      rev: 745eface02aef23e168a8afb6b5737818efbea95 # frozen: v0.11.0.1
      hooks:
          - id: shellcheck
            args: ['--color=always']

    # ── YAML (config in .yamllint; --strict fails on warnings too) ──────────────
    - repo: https://github.com/adrienverge/yamllint
      rev: cba56bcde1fdd01c1deb3f945e69764c291a6530 # frozen: v1.38.0
      hooks:
          - id: yamllint
            args: ['--strict']

    # ── Python (config in ruff.toml) ────────────────────────────────────────────
    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: 44b5042edab9382aba712eed4f9c7bab7a3d6a3e # frozen: v0.17.0
      hooks:
          - id: ruff-check
            args: ['--fix']
          - id: ruff-format
            types_or: [python, pyi]

    # ── GitHub Actions ──────────────────────────────────────────────────────────
    # actionlint checks the workflows' syntax, expressions, job graph and action inputs, and runs
    # shellcheck on every run: script. zizmor audits them for security: script injection,
    # over-broad permissions, persisted credentials, unpinned actions, dangerous triggers, cache
    # poisoning; its exceptions are in .github/zizmor.yml (CONTRIBUTING.md#lint). With GH_TOKEN set
    # (CI sets it) it also runs its online audits, such as known-vulnerable actions.
    - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
      rev: 805f85e558841bf4d852335e036b33d2b26be1cc # frozen: v1.7.12.25
      hooks:
          - id: actionlint
            additional_dependencies: ['shellcheck-py==0.11.0.1']
    - repo: https://github.com/zizmorcore/zizmor-pre-commit
      rev: fa412071e4f5d44d44f9e365f4676f9df92456a2 # frozen: v1.30.1
      hooks:
          - id: zizmor

    # ── Dockerfiles ─────────────────────────────────────────────────────────────
    # hadolint-py installs the checksum-verified hadolint release binary through pip, so no Docker
    # and no unpinned image. Inline `# hadolint ignore=` directives in the Dockerfiles apply.
    - repo: https://github.com/AleksaC/hadolint-py
      rev: 6e7504451511eaeb62a3e7f14d63b0296cbf86eb # frozen: v2.15.1
      hooks:
          - id: hadolint

    # ── this repository's own checks (tools/README.md) ──────────────────────────
    - repo: local
      hooks:
          # The credentials this project handles that GitHub's push protection does not catch: an
          # Artifactory API key or reference token, and any `scheme://user:pass@host` URL, such as
          # a REPO_URL with its password pasted into a compose file or an .env example. Push
          # protection, on for every public repository, covers the common providers' tokens. Mark
          # a deliberate placeholder or test fixture with an inline "pragma: allowlist secret"
          # comment; see tools/check_secrets.py.
          - id: check-secrets
            name: check for committed secrets
            entry: python tools/check_secrets.py
            language: python
            types: [text]

          # Documentation is a tree of cross-linked pages, and nothing else here would notice a
          # link going stale: renaming a heading silently breaks every reference to it, and the
          # references that rot most quietly are the bare `path/to/page.md#anchor` tokens in
          # comments (Python, YAML, shell, Apache .conf, Makefile, Dockerfiles, .env examples).
          # Checks Markdown links relative to their own file, and bare tokens in any other file
          # type relative to the repo root. Anchors follow GitHub's heading algorithm.
          #
          # WHOLE-TREE, NOT THE STAGED FILES: a commit renaming a heading touches no other file,
          # so checking only the staged files' outgoing links would never re-check the inbound
          # references aimed at it. `--tracked` makes the checker enumerate the tracked files
          # itself, and `always_run: true` runs it even for a commit that touches none of them.
          - id: check-doc-links
            name: check documentation links resolve
            entry: python tools/check_doc_links.py --tracked
            language: python
            pass_filenames: false
            always_run: true

          # Every setting the code reads must be documented in docs/reference/configuration.md,
          # and every setting documented there must still be read: tools/check_settings_documented.py
          # compares the settings registry (uc/uc/settings.py), web/entrypoint.sh and the compose
          # files with the page's tables. Whole-tree and always run, like check-doc-links: a commit
          # adding a setting to the registry touches no page.
          - id: check-settings-documented
            name: check settings are documented
            entry: python tools/check_settings_documented.py
            language: python
            pass_filenames: false
            always_run: true

          # Normalizes copy-paste "gremlin" characters to ASCII: smart quotes -> ' ", en/em dashes
          # -> -, ellipsis -> ..., exotic spaces -> a normal space, and strips zero-width / soft
          # hyphen / BOM / bidi controls. --fix rewrites in place and fails, like the fixers above.
          # Non-ASCII with no faithful ASCII form (box drawing, section signs, middle dots, arrows)
          # passes through untouched.
          - id: unicode-gremlins
            name: fix unicode gremlins (smart quotes, dashes, NBSP, zero-width, BOM, bidi)
            entry: python tools/check_gremlins.py --fix
            language: python
            types: [text]
            exclude: '^uc/patches/'

          # Schema-validate the compose files: the base stack on its own, and with the air-gapped or
          # build override merged on top. --no-interpolate validates structure without an env file.
          # `make compose-check` still does the full interpolated check plus the network and secret
          # isolation asserts. Skipped when Docker is not installed (tools/run_optional.py).
          - id: docker-compose-config
            name: docker compose config (validate)
            entry: python tools/run_optional.py docker compose -f compose.yaml config -q --no-interpolate
            language: python
            pass_filenames: false
            files: '^compose\.yaml$'

          - id: docker-compose-config-airgapped
            name: docker compose config (validate, air-gapped overlay)
            entry: python tools/run_optional.py docker compose -f compose.yaml -f compose.airgapped.yaml config -q --no-interpolate
            language: python
            pass_filenames: false
            files: '^compose(\.airgapped)?\.yaml$'

          - id: docker-compose-config-build
            name: docker compose config (validate, build override)
            entry: python tools/run_optional.py docker compose -f compose.yaml -f compose.build.yaml config -q --no-interpolate
            language: python
            pass_filenames: false
            files: '^compose(\.build)?\.yaml$'

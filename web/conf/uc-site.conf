# Download handling at server level (docs/architecture/request-routing.md#downloads); runs before the release's .htaccess.
# Included by every VirtualHost. Each needs PUBLIC_URL as its own ServerName: otherwise redirects
# name the container's port (8080, 8443), not the address controllers reach it on.
ServerName ${PUBLIC_URL}
RewriteEngine On

# Downloads are read-only: any other method is refused before a rule below can redirect or proxy
# it, so proxy mode never sends a PUT or DELETE to the repository with its credential.
RewriteCond %{REQUEST_METHOD} !^(GET|HEAD)$
RewriteRule "^/download/" "-" [R=405,L]

# DL_FLAGS is the flag list of every download rule below, so they are written once for both access
# modes: P proxies the request to the backend (credential set in <Proxy>), R=302 redirects to it.
<IfDefine ACCESS_PROXY>
    # QSD: the client's query string never reaches the backend or the redirect target.
    Define DL_FLAGS "P,L,QSD"
    SSLProxyEngine on
    SSLProxyVerify require
    # The default depth, 1, refuses any chain with an intermediate: almost every public certificate.
    SSLProxyVerifyDepth 10
    SSLProxyCheckPeerName on
    SSLProxyCACertificateFile "${DOWNLOAD_PROXY_CA_FILE}"
    ProxyTimeout 300
    <Proxy "${DOWNLOAD_BACKEND_URL}/*">
        RequestHeader set Authorization "${DOWNLOAD_PROXY_AUTH_HEADER}"
    </Proxy>
</IfDefine>
<IfDefine !ACCESS_PROXY>
    # QSD: the client's query string never reaches the backend or the redirect target.
    Define DL_FLAGS "R=302,L,QSD"
</IfDefine>

# latest links resolve through the generated current/latest/.htaccess
RewriteRule "^/download/war/latest/jenkins\.war$" "/latest/jenkins.war" [R=302,L,QSD]
RewriteRule "^/download/plugins/[^/]+/latest/([^/]+)\.hpi$" "/latest/$1.hpi" [R=302,L,QSD]

<IfDefine BACKEND_MIRROR>
    # get.jenkins.io layout, including upstream's war/ vs war-stable/ split
    RewriteRule "^/download/plugins/([^/]+)/([^/]+)/([^/]+)\.hpi$" "${DOWNLOAD_BACKEND_URL}/plugins/$1/$2/$3.hpi" [${DL_FLAGS}]
    RewriteRule "^/download/war/([0-9]+\.[0-9]+\.[0-9]+)/jenkins\.war$" "${DOWNLOAD_BACKEND_URL}/war-stable/$1/jenkins.war" [${DL_FLAGS}]
    RewriteRule "^/download/war/([^/]+)/jenkins\.war$" "${DOWNLOAD_BACKEND_URL}/war/$1/jenkins.war" [${DL_FLAGS}]
</IfDefine>

<IfDefine BACKEND_ARTIFACTORY>
    # Maven paths from the release's download map (written by uc generate)
    RewriteMap dl "txt:/data/live/.htdownload-map"
    RewriteCond "${dl:plugins/$1/$2}" "^(.+)$"
    RewriteRule "^/download/plugins/([^/]+)/([^/]+)/[^/]+\.hpi$" "${DOWNLOAD_BACKEND_URL}/%1" [${DL_FLAGS}]
    RewriteCond "${dl:war/$1}" "^(.+)$"
    RewriteRule "^/download/war/([^/]+)/jenkins\.war$" "${DOWNLOAD_BACKEND_URL}/%1" [${DL_FLAGS}]
</IfDefine>

# Anything else that looks like a binary is not available here.
RewriteRule "^/download/(plugins/[^/]+/[^/]+/[^/]+\.hpi|war/[^/]+/jenkins\.war)$" "-" [R=404,L]
